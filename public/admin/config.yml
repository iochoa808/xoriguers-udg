# Use DecapBridge classic auth (required)
backend:
  name: git-gateway
  repo: iochoa808/xoriguers-udg
  branch: main
  identity_url: https://auth.decapbridge.com/sites/527cd3bc-1fbf-4d38-96e7-c294c4cec610
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://iochoa808.github.io

# local_backend still lets `npm run dev:all` test against your local
# git checkout without touching DecapBridge/GitHub — Decap only honors
# this when the CMS is actually opened from localhost.
local_backend: true

publish_mode: editorial_workflow

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "agenda"
    label: "Agenda"
    folder: "src/content/agenda"
    create: true
    identifier_field: "nom"
    slug: "{{fields.data}}-{{fields.nom}}"
    # Decap only infers sortable fields called title/date/author/description, so
    # with 280-odd diades and Catalan field names the list arrived unsorted.
    summary: "{{data}} · {{nom}}"
    sortable_fields: ["data", "nom", "tipus"]
    view_groups:
      - label: "Any"
        field: "data"
        pattern: '\d{4}'
      - label: "Tipus"
        field: "tipus"
    view_filters:
      - label: "Actuacions"
        field: "tipus"
        pattern: "Actuacio"
      - label: "Diades"
        field: "tipus"
        pattern: "Diada"
      - label: "Assajos"
        field: "tipus"
        pattern: "Assaig"
      - label: "Amb observació"
        field: "observacio"
        pattern: "."
    fields:
      - { label: "Nom", name: "nom", widget: "string" }
      - { label: "Data", name: "data", widget: "date" }
      - { label: "Hora", name: "hora", widget: "string", required: false }
      - { label: "Lloc", name: "lloc", widget: "string", required: false }
      - { label: "Població", name: "poblacio", widget: "string", required: false }
      - label: "Tipus"
        name: "tipus"
        widget: "select"
        options: ["Actuacio", "Assaig", "Diada", "Trobada", "Altres"]
      - { label: "Cartell", name: "cartell", widget: "image", required: false }
      - { label: "Colles participants", name: "collesParticipants", widget: "list", required: false }
      - { label: "Mostrar a portada", name: "mostrarPortada", widget: "boolean", default: false, hint: "Si es marca, aquesta actuació es mostra a la portada com a propera actuació (encara que no sigui la més propera en data). Si cap actuació ho té marcat, es mostra automàticament la que ve abans." }
      - label: "Estat"
        name: "estat"
        widget: "select"
        options: ["esborrany", "revisio", "publicat"]
        default: "esborrany"
      - { label: "Cancel·lada", name: "cancelada", widget: "boolean", default: false }
      - { label: "Descripció", name: "body", widget: "markdown" }
      - label: "Castells"
        name: "castells"
        widget: "list"
        required: false
        summary: "{{fields.castell}} · {{fields.estat}}"
        fields:
          - { label: "Castell", name: "castell", widget: "string", hint: "Notació: 4d8, 3d7, 2d6..." }
          - label: "Estat"
            name: "estat"
            widget: "select"
            options: ["descarregat", "carregat", "intent"]
          - { label: "Ronda", name: "ronda", widget: "number", required: false, value_type: "int" }
          - { label: "Foto", name: "foto", widget: "image", required: false }
      - { label: "Observació", name: "observacio", widget: "string", required: false, hint: "Fites i notes: «Primer 5d7 de la història», «Cancel·lat per pluja». Es destaca a la fitxa i a l'historial." }
      - { label: "Compta per al CCCC", name: "cccc", widget: "boolean", default: false, required: false }
      - { label: "Notació original", name: "notacioOriginal", widget: "string", required: false, hint: "Els castells tal com es van escriure al registre antic. No cal tocar-ho." }
      - { label: "Identificador del calendari", name: "calendarUid", widget: "string", required: false, hint: "L'omple la importació de Google Calendar. No el canviïs: és el que evita que es dupliqui l'esdeveniment." }

  - name: "noticies"
    label: "Notícies"
    folder: "src/content/noticies"
    create: true
    identifier_field: "titol"
    slug: "{{fields.titol}}"
    summary: "{{data}} · {{titol}}"
    sortable_fields: ["data", "titol"]
    view_groups:
      - label: "Any"
        field: "data"
        pattern: '\d{4}'
    fields:
      - { label: "Títol", name: "titol", widget: "string" }
      - { label: "Data", name: "data", widget: "date" }
      - { label: "Resum", name: "resum", widget: "text" }
      - { label: "Imatge", name: "imatge", widget: "image", required: false }
      - label: "Estat"
        name: "estat"
        widget: "select"
        options: ["esborrany", "revisio", "publicat"]
        default: "esborrany"
      - { label: "Cos", name: "body", widget: "markdown" }

  - name: "galeria"
    label: "Galeria"
    folder: "src/content/galeria"
    create: true
    identifier_field: "nom"
    slug: "{{fields.nom}}"
    summary: "{{data}} · {{nom}}"
    sortable_fields: ["data", "nom"]
    view_groups:
      - label: "Any"
        field: "data"
        pattern: '\d{4}'
    fields:
      - { label: "Nom", name: "nom", widget: "string" }
      - { label: "Data", name: "data", widget: "date" }
      - { label: "Portada", name: "portada", widget: "image", required: false }
      - label: "Fotos"
        name: "fotos"
        widget: "list"
        required: false
        field: { label: "Foto", name: "foto", widget: "image" }
      - label: "Estat"
        name: "estat"
        widget: "select"
        options: ["esborrany", "revisio", "publicat"]
        default: "esborrany"

  - name: "pagines"
    label: "Pàgines"
    files:
      - name: "inici"
        label: "Inici (portada)"
        file: "src/content/pagines/inici.md"
        fields:
          - { label: "Titular principal", name: "titol", widget: "string", hint: "Es mostra en majúscules a la portada. No cal salt de línia, s'ajusta sol." }
          - { label: "Text del botó", name: "ctaText", widget: "string", required: false, hint: "Per defecte: 'Vine a assajar'" }
          - { label: "Fotografia de portada", name: "imatge", widget: "image", required: false, hint: "Si no se'n puja cap, es mostra un patró decoratiu." }
      - name: "la_colla"
        label: "La colla"
        file: "src/content/pagines/la-colla.md"
        fields:
          - { label: "Títol", name: "titol", widget: "string" }
          - { label: "Text principal", name: "body", widget: "markdown" }
          - { label: "Fotografia", name: "imatge", widget: "image", required: false }
          - { label: "Horari d'assajos", name: "assajosHorari", widget: "string" }
          - { label: "Lloc d'assajos", name: "assajosLloc", widget: "string" }
          - { label: "Email de contacte", name: "contacteEmail", widget: "string" }
          - { label: "Instagram", name: "contacteInstagram", widget: "string" }
      - name: "uneix_te"
        label: "Uneix-te"
        file: "src/content/pagines/uneix-te.md"
        fields:
          - { label: "Títol", name: "titol", widget: "string" }
          - { label: "Text de la crida", name: "body", widget: "markdown", hint: "Els horaris d'assaig i el contacte es mostren automàticament des de la pàgina 'La colla'." }
          - { label: "Horari assajos castellers", name: "practicaCastellersHorari", widget: "string", required: false }
          - { label: "Horari assajos músics", name: "practicaMusicsHorari", widget: "string", required: false }
          - { label: "Ubicació dels assajos", name: "practicaUbicacio", widget: "string", required: false, hint: "Coordenades 'latitud,longitud' o adreça, per mostrar el mapa." }
          - { label: "Fotografia", name: "imatge", widget: "image", required: false }
      - name: "merchandising"
        label: "Merchandising"
        file: "src/content/pagines/merchandising.md"
        fields:
          - { label: "Titular", name: "titol", widget: "string" }
          - { label: "Text", name: "body", widget: "markdown" }
          - { label: "Fotografia", name: "imatge", widget: "image", required: false }
      - name: "col_laboradors_intro"
        label: "Col·laboradors (introducció)"
        file: "src/content/pagines/col-laboradors-intro.md"
        fields:
          - { label: "Text introductori", name: "body", widget: "markdown", required: false, hint: "Text curt que es mostra a sota del títol, abans de la llista." }
      - name: "col_laboradors"
        label: "Col·laboradors (text de contacte)"
        file: "src/content/pagines/col-laboradors.md"
        fields:
          - { label: "Titular", name: "titol", widget: "string" }
          - { label: "Text", name: "body", widget: "markdown" }
          - { label: "Fotografia", name: "imatge", widget: "image", required: false }
      - name: "mallarengues"
        label: "Mallarengues"
        file: "src/content/pagines/mallarengues.md"
        fields:
          - { label: "Títol", name: "titol", widget: "string" }
          - { label: "Text", name: "body", widget: "markdown" }
          - { label: "Fotografia", name: "imatge", widget: "image", required: false }
          - { label: "Email de contacte", name: "contacteEmail", widget: "string", required: false }
      - name: "xorimusics"
        label: "Xorimúsics"
        file: "src/content/pagines/xorimusics.md"
        fields:
          - { label: "Títol", name: "titol", widget: "string" }
          - { label: "Text", name: "body", widget: "markdown" }
          - { label: "Fotografia", name: "imatge", widget: "image", required: false }
          - { label: "Email de contacte", name: "contacteEmail", widget: "string", required: false, hint: "L'horari i el mapa dels assajos es mostren automàticament des de la pàgina 'Uneix-te'." }
      - name: "agenda"
        label: "Capçalera: Agenda"
        file: "src/content/pagines/agenda.md"
        fields:
          - { label: "Fotografia de capçalera", name: "imatge", widget: "image", required: false, hint: "Si no se'n puja cap, es fa servir la de Configuració general." }
          - { label: "Text introductori", name: "body", widget: "markdown", required: false, hint: "Text curt que es mostra a sota del títol. Es pot deixar buit." }
      - name: "noticies"
        label: "Capçalera: Notícies"
        file: "src/content/pagines/noticies.md"
        fields:
          - { label: "Fotografia de capçalera", name: "imatge", widget: "image", required: false, hint: "Si no se'n puja cap, es fa servir la de Configuració general." }
          - { label: "Text introductori", name: "body", widget: "markdown", required: false, hint: "Text curt que es mostra a sota del títol. Es pot deixar buit." }
      - name: "galeria"
        label: "Capçalera: Galeria"
        file: "src/content/pagines/galeria.md"
        fields:
          - { label: "Fotografia de capçalera", name: "imatge", widget: "image", required: false, hint: "Si no se'n puja cap, es fa servir la de Configuració general." }
          - { label: "Text introductori", name: "body", widget: "markdown", required: false, hint: "Text curt que es mostra a sota del títol. Es pot deixar buit." }
      - name: "castells"
        label: "Capçalera: Historial de castells"
        file: "src/content/pagines/castells.md"
        fields:
          - { label: "Títol", name: "titol", widget: "string", required: false }
          - { label: "Fotografia de capçalera", name: "imatge", widget: "image", required: false, hint: "Si no se'n puja cap, es fa servir la de Configuració general." }
          - { label: "Text introductori", name: "body", widget: "markdown", required: false, hint: "Text curt que es mostra a sota del títol. Es pot deixar buit." }
      - name: "documents"
        label: "Capçalera: Documents"
        file: "src/content/pagines/documents.md"
        fields:
          - { label: "Fotografia de capçalera", name: "imatge", widget: "image", required: false, hint: "Si no se'n puja cap, es fa servir la de Configuració general." }
          - { label: "Text introductori", name: "body", widget: "markdown", required: false }
      - name: "junta_directiva_capcalera"
        label: "Capçalera: Junta Directiva"
        file: "src/content/pagines/junta-directiva.md"
        fields:
          - { label: "Fotografia de capçalera", name: "imatge", widget: "image", required: false, hint: "Si no se'n puja cap, es fa servir la de Configuració general." }
          - { label: "Text introductori", name: "body", widget: "markdown", required: false }
      - name: "junta_tecnica_capcalera"
        label: "Capçalera: Junta Tècnica"
        file: "src/content/pagines/junta-tecnica.md"
        fields:
          - { label: "Fotografia de capçalera", name: "imatge", widget: "image", required: false, hint: "Si no se'n puja cap, es fa servir la de Configuració general." }
          - { label: "Text introductori", name: "body", widget: "markdown", required: false }

  - name: "junta_directiva"
    label: "Junta Directiva"
    folder: "src/content/junta-directiva"
    create: true
    identifier_field: "numeroTemporada"
    slug: "temporada-{{fields.numeroTemporada}}"
    fields:
      - { label: "Número de temporada", name: "numeroTemporada", widget: "number", value_type: "int", hint: "Ex: 29 (es mostra com a XXIXè)" }
      - label: "Membres"
        name: "membres"
        widget: "list"
        required: false
        summary: "{{fields.carrec}} · {{fields.nom}} {{fields.cognom}}"
        fields:
          - { label: "Càrrec", name: "carrec", widget: "string", hint: "Ex: Presidenta, Secretari, Tresorer..." }
          - { label: "Nom", name: "nom", widget: "string" }
          - { label: "Cognom", name: "cognom", widget: "string" }
          - { label: "Malnom", name: "malnom", widget: "string", required: false }
          - { label: "Foto", name: "foto", widget: "image", required: false }

  - name: "junta_tecnica"
    label: "Junta Tècnica"
    folder: "src/content/junta-tecnica"
    create: true
    identifier_field: "numeroTemporada"
    slug: "temporada-{{fields.numeroTemporada}}"
    fields:
      - { label: "Número de temporada", name: "numeroTemporada", widget: "number", value_type: "int", hint: "Ex: 29 (es mostra com a XXIXè)" }
      - label: "Membres"
        name: "membres"
        widget: "list"
        required: false
        summary: "{{fields.carrec}} · {{fields.nom}} {{fields.cognom}}"
        fields:
          - { label: "Càrrec", name: "carrec", widget: "string", hint: "Ex: Cap de colla, Sotscap, Graller, Timbaler..." }
          - { label: "Nom", name: "nom", widget: "string" }
          - { label: "Cognom", name: "cognom", widget: "string" }
          - { label: "Malnom", name: "malnom", widget: "string", required: false }
          - { label: "Foto", name: "foto", widget: "image", required: false }

  - name: "productes"
    label: "Merchandising"
    folder: "src/content/productes"
    create: true
    identifier_field: "nom"
    slug: "{{fields.nom}}"
    fields:
      - { label: "Nom", name: "nom", widget: "string" }
      - { label: "Preu (€)", name: "preu", widget: "number" }
      - label: "Categoria"
        name: "categoria"
        widget: "select"
        options: ["Roba", "Dessuadora", "Complements"]
      - label: "Estat"
        name: "estat"
        widget: "select"
        options: ["Disponible", "Fora de termini"]
        default: "Disponible"
      - label: "Fotos"
        name: "fotos"
        widget: "list"
        required: false
        field: { label: "Foto", name: "foto", widget: "image" }
      - label: "Talles i estoc"
        name: "talles"
        widget: "list"
        required: false
        summary: "{{fields.talla}} · {{fields.estoc}}"
        fields:
          - { label: "Talla", name: "talla", widget: "string", hint: "Ex: S, M, L, XL, XXL, o Única" }
          - { label: "Estoc", name: "estoc", widget: "number", required: false, value_type: "int" }
      - { label: "Ordre", name: "ordre", widget: "number", required: false, value_type: "int" }

  - name: "patrocinadors"
    label: "Patrocinadors"
    folder: "src/content/patrocinadors"
    create: true
    identifier_field: "nom"
    slug: "{{fields.nom}}"
    fields:
      - { label: "Nom", name: "nom", widget: "string" }
      - { label: "Logotip", name: "logo", widget: "image", required: false }
      - { label: "Web", name: "url", widget: "string", required: false }
      - { label: "Ordre", name: "ordre", widget: "number", required: false, value_type: "int" }

  - name: "documents"
    label: "Documents"
    folder: "src/content/documents"
    create: true
    identifier_field: "titol"
    slug: "{{fields.titol}}"
    fields:
      - { label: "Títol", name: "titol", widget: "string" }
      - label: "Categoria"
        name: "categoria"
        widget: "select"
        options: ["Estatuts", "Reglament", "Protocol", "Altres"]
      - { label: "Fitxer (PDF)", name: "fitxer", widget: "file" }
      - { label: "Data", name: "data", widget: "date", required: false }

  - name: "configuracio"
    label: "Configuració"
    files:
      - name: "general"
        label: "Configuració general"
        file: "src/content/configuracio/general.md"
        fields:
          - { label: "URL Instagram", name: "instagramUrl", widget: "string", required: false }
          - { label: "URL YouTube", name: "youtubeUrl", widget: "string", required: false }
          - { label: "Email per a reserves de merchandising", name: "merchandiseEmail", widget: "string", required: false, hint: "Rep les reserves que es facin des de la fitxa de cada producte" }
          - label: "URL d'inserció de Google Calendar"
            name: "googleCalendarEmbedUrl"
            widget: "string"
            required: false
            hint: "URL del calendari de Google Calendar en mode 'Insereix' (Configuració > Integra el calendari)"
          - { label: "Email de contacte comercial/patrocinis", name: "contacteComercialEmail", widget: "string", required: false }
          - { label: "Nom del responsable de patrocinis", name: "contacteComercialNom", widget: "string", required: false, hint: "Ex: Responsable de patrocinis" }
          - { label: "Fotografia de capçalera", name: "capceleraImatge", widget: "image", required: false, hint: "Imatge de fons que es mostra a la capçalera de totes les pàgines (llevat de l'inici)" }
          - { label: "Descripció general (SEO)", name: "descripcioGeneral", widget: "text", required: false, hint: "S'utilitza com a meta descripció a les pàgines que no en tenen una de pròpia (per exemple quan es comparteix l'enllaç a xarxes). Recomanat: 1-2 frases curtes." }
