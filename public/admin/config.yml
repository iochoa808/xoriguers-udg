# Use DecapBridge classic auth (required)
backend:
  name: git-gateway
  repo: iochoa808/xoriguers-udg
  branch: main
  identity_url: https://auth.decapbridge.com/sites/527cd3bc-1fbf-4d38-96e7-c294c4cec610
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://iochoa808.github.io

# local_backend still lets `npm run dev:all` test against your local
# git checkout without touching DecapBridge/GitHub — Decap only honors
# this when the CMS is actually opened from localhost.
local_backend: true

publish_mode: editorial_workflow

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "agenda"
    label: "Agenda"
    folder: "src/content/agenda"
    create: true
    identifier_field: "nom"
    slug: "{{fields.nom}}"
    fields:
      - { label: "Nom", name: "nom", widget: "string" }
      - { label: "Data", name: "data", widget: "date" }
      - { label: "Hora", name: "hora", widget: "string" }
      - { label: "Lloc", name: "lloc", widget: "string" }
      - { label: "Població", name: "poblacio", widget: "string" }
      - label: "Tipus"
        name: "tipus"
        widget: "select"
        options: ["Actuacio", "Assaig", "Diada", "Trobada"]
      - { label: "Cartell", name: "cartell", widget: "image", required: false }
      - { label: "Colles participants", name: "collesParticipants", widget: "list", required: false }
      - { label: "Mostrar a portada", name: "mostrarPortada", widget: "boolean", default: false }
      - label: "Estat"
        name: "estat"
        widget: "select"
        options: ["esborrany", "revisio", "publicat"]
        default: "esborrany"
      - { label: "Cancel·lada", name: "cancelada", widget: "boolean", default: false }
      - { label: "Descripció", name: "body", widget: "markdown" }
      - label: "Castells"
        name: "castells"
        widget: "list"
        required: false
        summary: "{{fields.castell}} · {{fields.estat}}"
        fields:
          - { label: "Castell", name: "castell", widget: "string", hint: "Notació: 4d8, 3d7, 2d6..." }
          - label: "Estat"
            name: "estat"
            widget: "select"
            options: ["descarregat", "carregat", "intent"]
          - { label: "Ronda", name: "ronda", widget: "number", required: false, value_type: "int" }
          - { label: "Foto", name: "foto", widget: "image", required: false }

  - name: "noticies"
    label: "Notícies"
    folder: "src/content/noticies"
    create: true
    identifier_field: "titol"
    slug: "{{fields.titol}}"
    fields:
      - { label: "Títol", name: "titol", widget: "string" }
      - { label: "Data", name: "data", widget: "date" }
      - { label: "Resum", name: "resum", widget: "text" }
      - { label: "Imatge", name: "imatge", widget: "image", required: false }
      - label: "Estat"
        name: "estat"
        widget: "select"
        options: ["esborrany", "revisio", "publicat"]
        default: "esborrany"
      - { label: "Cos", name: "body", widget: "markdown" }

  - name: "galeria"
    label: "Galeria"
    folder: "src/content/galeria"
    create: true
    identifier_field: "nom"
    slug: "{{fields.nom}}"
    fields:
      - { label: "Nom", name: "nom", widget: "string" }
      - { label: "Data", name: "data", widget: "date" }
      - { label: "Portada", name: "portada", widget: "image", required: false }
      - label: "Fotos"
        name: "fotos"
        widget: "list"
        required: false
        field: { label: "Foto", name: "foto", widget: "image" }
      - label: "Estat"
        name: "estat"
        widget: "select"
        options: ["esborrany", "revisio", "publicat"]
        default: "esborrany"

  - name: "pagines"
    label: "Pàgines"
    files:
      - name: "la_colla"
        label: "La colla"
        file: "src/content/pagines/la-colla.md"
        fields:
          - { label: "Títol", name: "titol", widget: "string" }
          - { label: "Text principal", name: "body", widget: "markdown" }
          - { label: "Horari d'assajos", name: "assajosHorari", widget: "string" }
          - { label: "Lloc d'assajos", name: "assajosLloc", widget: "string" }
          - { label: "Email de contacte", name: "contacteEmail", widget: "string" }
          - { label: "Instagram", name: "contacteInstagram", widget: "string" }

  - name: "persones"
    label: "Equip"
    folder: "src/content/persones"
    create: true
    identifier_field: "nom"
    slug: "{{fields.nom}}"
    fields:
      - { label: "Nom", name: "nom", widget: "string" }
      - { label: "Càrrec", name: "carrec", widget: "string", hint: "Ex: Presidenta, Cap de colla, Graller..." }
      - label: "Categoria"
        name: "categoria"
        widget: "select"
        options: ["Junta", "Cap de colla", "Musics"]
      - { label: "Foto", name: "foto", widget: "image", required: false }
      - { label: "Ordre", name: "ordre", widget: "number", required: false, value_type: "int", hint: "Per ordenar dins la categoria (menor primer)" }

  - name: "patrocinadors"
    label: "Patrocinadors"
    folder: "src/content/patrocinadors"
    create: true
    identifier_field: "nom"
    slug: "{{fields.nom}}"
    fields:
      - { label: "Nom", name: "nom", widget: "string" }
      - { label: "Logotip", name: "logo", widget: "image", required: false }
      - { label: "Web", name: "url", widget: "string", required: false }
      - { label: "Ordre", name: "ordre", widget: "number", required: false, value_type: "int" }

  - name: "documents"
    label: "Documents"
    folder: "src/content/documents"
    create: true
    identifier_field: "titol"
    slug: "{{fields.titol}}"
    fields:
      - { label: "Títol", name: "titol", widget: "string" }
      - label: "Categoria"
        name: "categoria"
        widget: "select"
        options: ["Estatuts", "Reglament", "Protocol", "Altres"]
      - { label: "Fitxer (PDF)", name: "fitxer", widget: "file" }
      - { label: "Data", name: "data", widget: "date", required: false }

  - name: "configuracio"
    label: "Configuració"
    files:
      - name: "general"
        label: "Configuració general"
        file: "src/content/configuracio/general.md"
        fields:
          - { label: "URL Instagram", name: "instagramUrl", widget: "string", required: false }
          - { label: "URL YouTube", name: "youtubeUrl", widget: "string", required: false }
          - { label: "URL botiga (merchandising)", name: "merchandiseUrl", widget: "string", required: false }
          - label: "URL d'inserció de Google Calendar"
            name: "googleCalendarEmbedUrl"
            widget: "string"
            required: false
            hint: "URL del calendari de Google Calendar en mode 'Insereix' (Configuració > Integra el calendari)"
